<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Collab Machine</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f5f7;min-height:100vh}
header{padding:20px;border-bottom:1px solid #252936;position:sticky;top:0;background:#0b0d12e8;backdrop-filter:blur(14px)}
main{max-width:760px;margin:auto;padding:20px}.brand{font-weight:800;font-size:20px}.muted{color:#9299aa}
.card{border:1px solid #252936;border-radius:18px;padding:18px;margin:14px 0;background:#11141b}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
button{border:0;border-radius:12px;padding:11px 15px;background:#f4f5f7;color:#0b0d12;font-weight:700}
pre{white-space:pre-wrap;font:12px ui-monospace,monospace;color:#aab1c2}
</style>
</head>
<body>
<header><div class="brand">⚡ Collab Machine</div><div class="muted">Colab + Ollama control center</div></header>
<main>
<section class="card"><div class="row"><strong>Backend</strong><span id="backend">checking…</span></div><p class="muted">Base do app criada. Agora entram OAuth, runtime e chat.</p></section>
<section class="card"><div class="row"><strong>Google Colab</strong><button id="refresh">Atualizar</button></div><p id="colab" class="muted">Carregando…</p></section>
<section class="card"><div class="row"><strong>Ollama</strong><span id="ollama">checking…</span></div><pre id="log"></pre></section>
</main>
<script>
const API=localStorage.getItem("collab_api_url")||"http://localhost:8000/api/v1";
async function load(){
try{
const [s,o,c]=await Promise.all([
fetch(API+"/status").then(r=>r.json()),
fetch(API+"/ollama/status").then(r=>r.json()),
fetch(API+"/colab/runtimes").then(r=>r.json())
]);
document.querySelector("#backend").textContent="online";
document.querySelector("#ollama").textContent=o.online?"online":"offline";
document.querySelector("#colab").textContent=s.colab_api_enabled?c.runtimes.length+" runtime(s)":"API ainda não configurada";
document.querySelector("#log").textContent=JSON.stringify({status:s,ollama:o,colab:c},null,2);
}catch(e){document.querySelector("#backend").textContent="offline";document.querySelector("#log").textContent=String(e)}
}
document.querySelector("#refresh").onclick=load;load();
</script>
</body></html>
