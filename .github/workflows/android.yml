name: Android APK

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9
      - name: Generate CI signing key
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore ci-release.keystore -storepass android -keypass android -alias ollama-studio -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ollama Studio, OU=CI, O=Ollama Studio, L=NA, ST=NA, C=BR"
      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ../ci-release.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: ollama-studio
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ollama-studio-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
